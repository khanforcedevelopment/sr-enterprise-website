<!doctype html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;background:#0a1224;font-family:Georgia,'Times New Roman',serif;position:relative;overflow:hidden;color:#fff}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px}
  .glow{position:absolute;right:-160px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(197,147,58,.28),transparent 65%)}
  .frame{position:absolute;inset:36px;border:1.5px solid rgba(211,169,82,.55);border-radius:18px}
  .wrap{position:absolute;left:96px;top:110px;right:96px}
  .row{display:flex;align-items:center;gap:28px}
  .gold{background:linear-gradient(90deg,#ead9a9,#d3a952 45%,#c5933a);-webkit-background-clip:text;color:transparent}
  .brand{font-size:58px;font-weight:700;letter-spacing:9px}
  .sub{font-family:Arial,Helvetica,sans-serif;font-size:17px;letter-spacing:5px;color:#ead9a9;margin-top:6px;font-weight:600}
  h1{font-size:46px;line-height:1.2;font-weight:600;margin:70px 0 0;max-width:900px}
  p{font-family:Arial,Helvetica,sans-serif;font-size:22px;color:#c4d1e6;margin-top:24px}
  .bar{position:absolute;left:96px;bottom:84px;width:120px;height:4px;background:linear-gradient(90deg,#d3a952,#a9762f)}
</style></head><body>
<div class="grid"></div><div class="glow"></div><div class="frame"></div>
<div class="wrap">
  <div class="row">
    <svg width="104" height="104" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ead9a9"/><stop offset=".5" stop-color="#c5933a"/><stop offset="1" stop-color="#a9762f"/></linearGradient></defs><rect width="64" height="64" rx="12" fill="#121e36"/><rect x="4.5" y="4.5" width="55" height="55" rx="8.5" fill="none" stroke="url(#g)" stroke-width="2"/><text x="32" y="42.5" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="url(#g)">SR</text></svg>
    <div><div class="brand">SR <span class="gold">ENTERPRISE</span></div><div class="sub">SUNIL RANA ENTERPRISE FZE LLC</div></div>
  </div>
  <h1>Professional Business Consultancy &amp; <span class="gold">Project Management</span> Solutions</h1>
  <p>Facilities Resource Planning · Project Management · Architectural Model Supplies · Ajman, UAE</p>
</div>
<div class="bar"></div>
</body></html>
